[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tubie-stickman"
version = "0.1.0"
description = "Cross-platform Turkish stickman video production tools"
requires-python = ">=3.10,<3.15"
dependencies = ["edge-tts>=7,<8", "faster-whisper>=1.1,<2"]

[project.optional-dependencies]
dev = ["Pillow>=10"]
record = ["numpy>=1.24", "sounddevice>=0.4", "soundfile>=0.12"]
clone = ["coqui-tts>=0.27.4,<0.29", "torch>=2.2", "torchaudio>=2.2", "torchcodec; python_version >= '3.10'"]

[project.scripts]
tubie = "tubie_stickman.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
